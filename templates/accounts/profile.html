<!DOCTYPE html>
<html>

<head>

    <title>My Profile</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 40px 20px;
        }

        .profile-container {
            width: 100%;
            max-width: 500px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        .username {
            background-color: #eeeeee;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            background-color: blue;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .links {
            margin-top: 25px;
            text-align: center;
        }

        .links a {
            display: inline-block;
            margin: 5px;
            padding: 10px 15px;
            background-color: #555;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .success {
            color: green;
            text-align: center;
            margin-bottom: 15px;
        }

        /* Tablet */

        @media (max-width: 768px) {

            body {
                padding: 25px 15px;
            }

            .profile-container {
                padding: 25px 20px;
            }

        }

        /* Mobile */

        @media (max-width: 480px) {

            body {
                padding: 15px 10px;
            }

            .profile-container {
                padding: 20px 15px;
                border-radius: 8px;
            }

            h1 {
                font-size: 24px;
                margin-bottom: 25px;
            }

            label {
                font-size: 14px;
            }

            input {
                padding: 12px;
                font-size: 16px;
            }

            button {
                padding: 13px;
            }

            .links {
                margin-top: 20px;
            }

            .links a {
                display: block;
                width: 100%;
                margin: 8px 0;
                padding: 12px;
            }

        }

    </style>

</head>

<body>


<div class="profile-container">

    <h1>
        👤 My Profile
    </h1>


    {% if messages %}

        {% for message in messages %}

            <p class="success">
                {{ message }}
            </p>

        {% endfor %}

    {% endif %}


    <form method="POST">

        {% csrf_token %}


        <label>
            Username
        </label>

        <input
            type="text"
            value="{{ user.username }}"
            class="username"
            readonly
        >


        <label>
            First Name
        </label>

        <input
            type="text"
            name="first_name"
            value="{{ user.first_name }}"
        >


        <label>
            Last Name
        </label>

        <input
            type="text"
            name="last_name"
            value="{{ user.last_name }}"
        >


        <label>
            Email
        </label>

        <input
            type="email"
            name="email"
            value="{{ user.email }}"
        >


        <button type="submit">
            Update Profile
        </button>

    </form>


    <div class="links">

        <a href="{% url 'my_orders' %}">
            📦 My Orders
        </a>

        <a href="{% url 'saved_addresses' %}">
            🏠 Saved Addresses
        </a>

        <a href="{% url 'product_list' %}">
            🛍️ Products
        </a>

    </div>

</div>


</body>

</html>
