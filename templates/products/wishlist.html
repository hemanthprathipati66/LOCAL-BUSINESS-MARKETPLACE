<!DOCTYPE html>
<html>

<head>

    <title>My Wishlist</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #f5f5f5;
        }

        .wishlist-container {
            width: 100%;
            max-width: 700px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .item {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .item h2 {
            margin-top: 0;
            word-break: break-word;
        }

        .item p {
            line-height: 1.5;
        }

        .price {
            font-size: 18px;
            font-weight: bold;
        }

        .btn {
            display: inline-block;
            padding: 10px 15px;
            margin-top: 10px;
            margin-right: 5px;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            text-align: center;
        }

        .view-btn {
            background-color: blue;
        }

        .remove-btn {
            background-color: red;
        }

        .empty {
            text-align: center;
            color: #666;
            padding: 20px;
        }

        /* Tablet */
        @media (max-width: 768px) {

            body {
                padding: 25px 15px;
            }

            .wishlist-container {
                padding: 25px 20px;
            }

        }

        /* Mobile */
        @media (max-width: 480px) {

            body {
                padding: 15px 10px;
            }

            .wishlist-container {
                padding: 20px 15px;
                border-radius: 8px;
            }

            h1 {
                font-size: 24px;
            }

            .item {
                padding: 15px;
            }

            .item h2 {
                font-size: 20px;
            }

            .item p {
                font-size: 14px;
            }

            .price {
                font-size: 17px;
            }

            .btn {
                display: block;
                width: 100%;
                margin-right: 0;
                margin-top: 10px;
                padding: 12px;
            }

        }

    </style>

</head>

<body>

<div class="wishlist-container">

    <h1>My Wishlist ❤️</h1>

    {% for item in wishlist_items %}

        <div class="item">

            <h2>
                {{ item.product.name }}
            </h2>

            <p>
                {{ item.product.description }}
            </p>

            <p class="price">
                ₹{{ item.product.price|floatformat:2 }}
            </p>

            <a
                href="{% url 'product_detail' item.product.id %}"
                class="btn view-btn"
            >
                View Product
            </a>

            <a
                href="{% url 'remove_from_wishlist' item.id %}"
                class="btn remove-btn"
            >
                Remove
            </a>

        </div>

    {% empty %}

        <p class="empty">
            Your wishlist is empty.
        </p>

    {% endfor %}

    <a
        href="{% url 'product_list' %}"
        class="btn view-btn"
    >
        Continue Shopping
    </a>

</div>

</body>

</html>
